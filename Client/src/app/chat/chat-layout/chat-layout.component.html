<div class="chat-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="chat-sidebar">
    <!-- Sidebar Header -->
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="sidebar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
        </div>
        <span class="sidebar-title">QuickChat</span>
      </div>

      <!-- User Menu -->
      <div class="user-menu-wrapper">
        <button class="user-avatar-btn" id="user-menu-btn" (click)="toggleDropdown()" title="Menu">
          <span class="avatar-letter">{{ getInitials() }}</span>
        </button>

        @if (showDropdown) {
        <div class="dropdown-overlay" (click)="closeDropdown()"></div>
        <div class="dropdown-menu" id="user-dropdown-menu">
          <div class="dropdown-user-info">
            <div class="dropdown-avatar">
              <span>{{ getInitials() }}</span>
            </div>
            <div class="dropdown-user-text">
              <strong>{{ authService.currentUser()?.username || 'User' }}</strong>
              <small>{{ authService.currentUser()?.email || '' }}</small>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" id="dropdown-profile" (click)="goToProfile()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            My Profile
          </button>
          <button class="dropdown-item" id="dropdown-settings" (click)="goToSettings()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            Settings
          </button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item danger" id="dropdown-logout" (click)="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" x2="9" y1="12" y2="12" />
            </svg>
            Log Out
          </button>
        </div>
        }
      </div>
    </div>

    <!-- Search -->
    <app-user-search></app-user-search>

    <!-- Room list -->
    <app-room-list></app-room-list>
  </aside>

  <!-- Main Chat Area -->
  <main class="chat-main" id="chat-main">
    <app-chat-window></app-chat-window>
  </main>
</div>
