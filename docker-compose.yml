services:
  mongodb:
    image: mongo:7-jammy
    container_name: quickchat-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - quickchat-net

  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: quickchat-backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=${PORT:-5001}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/bilingual-chat}
      - JWT_SECRET=${JWT_SECRET:-changeme_in_production_jwt_secret}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:4200}
    depends_on:
      - mongodb
    networks:
      - quickchat-net

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: quickchat-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - server
    networks:
      - quickchat-net

networks:
  quickchat-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
